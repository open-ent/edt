name: dev-check-repository

on:
  push:
  workflow_dispatch:
    inputs:
      entcore_version:
        description: 'Version entcore (ex: 6.14.9-patched). Laissez vide pour utiliser la version du pom.xml.'
        required: false
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  build-node-test:
    runs-on: ubuntu-latest

    container:
      image: opendigitaleducation/node:10-alpine
      options: --user root -v ${{ github.workspace }}:/home/node/:rw

    steps:
      - uses: actions/checkout@v1
      - name: Run npm install
        run: npm install
      - name: Run build node with Gulp
        run: node_modules/gulp/bin/gulp.js build
      - name: Run test
        run: npm test

  build-maven-test:
    runs-on: ubuntu-latest

    container:
      image: maven:3.8.6-jdk-8
      options: --user root -v ${{ github.workspace }}:/home/maven/:rw

    steps:
      - uses: actions/checkout@v1

      - name: Configure Maven pour GitHub Packages
        run: |
          mkdir -p /var/maven/.m2
          cat > /var/maven/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github-open-ent</id>
                <username>$GITHUB_ACTOR</username>
                <password>$GITHUB_TOKEN</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github-open-ent</id>
                    <name>GitHub open-ent Packages</name>
                    <url>https://maven.pkg.github.com/open-ent/entcore-v2</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Run build maven
        run: |
          ENTCORE_OPT=""
          if [ -n "$ENTCORE_VERSION" ]; then ENTCORE_OPT="-DentCoreVersion=$ENTCORE_VERSION"; fi
          mvn -Duser.home=/var/maven clean install $ENTCORE_OPT
        env:
          ENTCORE_VERSION: ${{ github.event.inputs.entcore_version }}

      - name: Run maven test
        run: mvn -Duser.home=/var/maven test
