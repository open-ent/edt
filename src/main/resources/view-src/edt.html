<!DOCTYPE html>
<html>

	<head>
		<title>{{#i18n}}edt.fullTitle{{/i18n}}</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

        <script src="/assets/js/entcore/ng-app.js?v=@@VERSION" id="context" type="text/javascript"></script>
		<script type="text/javascript" src="/edt/public/dist/application.js?v=@@VERSION"></script>
		
		<script type="text/javascript">
            window.overrideLoaderConfig=function(config){
                config.removeDep('moment+langs.js')
                config.prependDep("moment-timezone-0.5.21.js")
                config.prependDep("moment-2.7.0.js")
            }
		</script>
		<!--
		  Styles du bandeau de bascule, en ligne plutôt que dans public/sass/ : ce bandeau est un
		  échafaudage de migration, destiné à disparaître avec l'IHM AngularJS (même choix que l'Agenda).
		  Teintes neutres : la feuille du thème chargée ici n'expose pas les jetons `--openent-*` du socle.
		-->
		<style type="text/css">
		  .edt-ui-switch {
		    position: fixed;
		    left: 50%;
		    bottom: 16px;
		    transform: translateX(-50%);
		    z-index: 9000;
		    max-width: calc(100vw - 32px);
		    display: flex;
		    align-items: center;
		    gap: 24px;
		    padding: 12px 16px;
		    border-radius: 8px;
		    background: #243242;
		    color: #fff;
		    box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
		    font-size: 14px;
		  }
		  .edt-ui-switch[hidden] { display: none; }
		  .edt-ui-switch-text { display: flex; flex-direction: column; gap: 2px; }
		  .edt-ui-switch-text span { opacity: .8; }
		  .edt-ui-switch-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
		  .edt-ui-switch-actions button {
		    border: 0;
		    border-radius: 6px;
		    padding: 8px 14px;
		    font-size: 14px;
		    cursor: pointer;
		    background: transparent;
		    color: #fff;
		    text-decoration: underline;
		  }
		  .edt-ui-switch-actions button.primary {
		    background: #fff;
		    color: #243242;
		    font-weight: 600;
		    text-decoration: none;
		  }
		  @media (max-width: 600px) {
		    .edt-ui-switch { flex-direction: column; align-items: stretch; gap: 12px; }
		  }
		</style>
		<script type="text/ng-template" id="empty"></script>
	</head>

	<body ng-controller="EdtController" class="edt">
		<portal>
			<container class="twelve cell" template="main"></container>
		</portal>

		<!--
		  Invitation à essayer la nouvelle IHM React, rendue en HTML pour que les libellés passent par la
		  balise i18n du gabarit (seul contexte correctement échappé — les textes français ont des
		  apostrophes). Hors de <portal> et en position fixe : aucune interaction avec la mise en page
		  AngularJS. Masquée par défaut ; ui-switch.js décide de l'afficher d'après la préférence `edtUi`.
		-->
		<div id="edt-ui-switch" class="edt-ui-switch" hidden>
		  <div class="edt-ui-switch-text">
		    <strong>{{#i18n}}edt.switch.invitation.title{{/i18n}}</strong>
		    <span>{{#i18n}}edt.switch.invitation.body{{/i18n}}</span>
		  </div>
		  <div class="edt-ui-switch-actions">
		    <button type="button" data-action="later">{{#i18n}}edt.switch.invitation.later{{/i18n}}</button>
		    <button type="button" data-action="try" class="primary">{{#i18n}}edt.switch.invitation.try{{/i18n}}</button>
		  </div>
		</div>
		<script type="text/javascript" src="/edt/public/ui-switch.js?v=@@VERSION"></script>
	</body>

</html>
